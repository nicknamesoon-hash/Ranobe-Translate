[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ranobe-translator"
version = "2.0.0.dev0"
description = "Context-aware light novel translator powered by LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "charset-normalizer>=3.4,<4",
    "keyring>=25,<26",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "hypothesis>=6",
    "ruff>=0.9",
]

[project.scripts]
ranobe-cli = "ranobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ranobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic/CJK characters in strings and comments are intended

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold long CJK strings (ruff counts them as double width).
"tests/**" = ["E501"]
# Prompt rules are prose; one rule per line reads better than wrapped strings.
"src/ranobe/core/prompts/rules_*.py" = ["E501"]
