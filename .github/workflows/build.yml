# App builds for every push to main, kept as workflow artifacts.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: apk
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # the Windows console is cp1252 by default
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - run: python -m pip install -e ".[ui]"
      - name: flet build
        shell: bash
        run: |
          set -o pipefail
          # Run from the project root: flet reads dependencies and [tool.flet] from pyproject.toml
          # here and packages tool.flet.app.path (src).
          flet build ${{ matrix.target }} --yes --verbose 2>&1 | tee build.log
      # Logs need a GitHub login to read; annotations do not. Surface the end of a failed log.
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 build.log | grep -v '^\s*$' | tail -n 40 > tail.log || true
          python - <<'PY'
          from pathlib import Path
          text = Path("tail.log").read_text(encoding="utf-8", errors="replace")
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=flet build ${{ matrix.target }}::{text}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ranobe-translator-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
