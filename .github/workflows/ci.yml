name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  epubcheck:
    runs-on: ubuntu-latest
    env:
      EPUBCHECK_VERSION: "5.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          url="https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}"
          curl -sSL -o epubcheck.zip "$url/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/services/test_exporters.py -k epubcheck -rs
        env:
          EPUBCHECK_JAR: ${{ runner.temp }}/epubcheck-${{ env.EPUBCHECK_VERSION }}/epubcheck.jar
